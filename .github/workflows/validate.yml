name: Validate vAIn
on:
  pull_request:
  workflow_dispatch:
jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Pages Function JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find functions/api -type f -name '*.js' -print0)
      - name: Validate D1 migrations against SQLite
        run: |
          sqlite3 :memory: < migrations/0001_initial.sql
          sqlite3 :memory: < migrations/0002_user_scoped_data.sql
